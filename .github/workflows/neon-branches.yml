# shared:neon-branches v3
name: Neon branches

on:
  pull_request:
    types: [opened, reopened, closed]

permissions:
  contents: read

jobs:
  create:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Neon branch
        id: neon
        env:
          PR_NUMBER: ${{ github.event.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          safe_ref="${HEAD_REF//\//-}"
          printf 'name=preview/pr-%s-%s\n' "$PR_NUMBER" "$safe_ref" >> "$GITHUB_OUTPUT"
      - uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
          branch_name: ${{ steps.neon.outputs.name }}
          api_key: ${{ secrets.NEON_API_KEY }}
          database: ptcgp
          role: neondb_owner

  delete:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Neon branch
        id: neon
        env:
          PR_NUMBER: ${{ github.event.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          safe_ref="${HEAD_REF//\//-}"
          printf 'name=preview/pr-%s-%s\n' "$PR_NUMBER" "$safe_ref" >> "$GITHUB_OUTPUT"
      - uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
          branch: ${{ steps.neon.outputs.name }}
          api_key: ${{ secrets.NEON_API_KEY }}
