name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: crashoutcompany/.github/.github/workflows/ci.yml@4b12aa1219d314a94d0c3a69c4b30258a8aa3561 # v1.1.0
    with:
      test-script: test:coverage
      has-e2e: true
      use-prisma-neon: true
      # The repo's NEON_DATABASE secret points at the empty ptcgp database; the
      # Prisma tables live in neondb.
      neon-database: neondb
      neon-role: neondb_owner
    secrets: inherit
