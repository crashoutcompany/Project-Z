name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: crashoutcompany/.github/.github/workflows/ci.yml@fb4ced16d6e9b46edfbd2e6d8da421436b88622b # crashoutcompany/.github#4 (prisma-migrate-neon); re-pin to the release tag once merged
    with:
      test-script: test:coverage
      has-e2e: true
      use-prisma-neon: true
      # Apply this PR's migrations to the throwaway e2e Neon branch (copied from
      # an older parent). Needs the pinned shared-workflow revision above.
      prisma-migrate-neon: true
      # The repo's NEON_DATABASE secret points at the empty ptcgp database; the
      # Prisma tables live in neondb.
      neon-database: neondb
      neon-role: neondb_owner
    secrets: inherit
