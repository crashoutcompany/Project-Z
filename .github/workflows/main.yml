name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: crashoutcompany/.github/.github/workflows/ci.yml@72b17a43589bb357f01c41bed231b8e2390912e2 # v1.6.0
    with:
      node-version: "26"
      # test:ci = coverage + `db:check-drift` (migrations vs schema, shadow DB is the job's Postgres service).
      test-script: test:ci
      has-e2e: true
      use-prisma-neon: true
      # Apply this PR's migrations to the throwaway e2e Neon branch (copied from
      # an older parent). Requires shared workflow v1.2.0 or later.
      prisma-migrate-neon: true
      # The repo's NEON_DATABASE secret points at the empty ptcgp database; the
      # Prisma tables live in neondb.
      neon-database: neondb
      neon-role: neondb_owner
      e2e-branch-expires-minutes: 120
      e2e-cleanup-stale: true
    secrets: inherit
